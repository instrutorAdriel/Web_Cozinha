spring.application.name=WebApplicationSIGEC

server.port=8080

spring.datasource.url=${DB_URL}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configurações do Servidor de E-mail (Gmail SMTP de Exemplo)
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_NAME}
spring.mail.password=${MAIL_PASS}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS}


server.servlet.session.tracking-modes=cookie