<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Senha - SIGEC</title>
    <link rel="stylesheet" th:href="@{/styles/style.css}">
    <link rel="stylesheet" th:href="@{/styles/alterarSenha.css}">
</head>
<body>
<div class="background-container">
    <div class="card-recovery">
        <div class="logo-container">
            <img th:src="@{/img/logo-branca-senac-fecomercio.png}" alt="Logo Senac" class="logo">
        </div>

        <h2>Redefinir Senha</h2>
        <p class="subtitle">Crie uma nova senha para a sua conta.</p>

        <form th:action="@{/esqueci-senha/salvar-senha}" method="post">
            <input type="hidden" name="email" th:value="${email}">

            <div class="form-group">
                <label for="novaSenha">Nova Senha</label>
                <input type="password" id="novaSenha" name="novaSenha" placeholder="Digite a nova senha" required minlength="6">
            </div>

            <div class="form-group">
                <label for="confirmarSenha">Confirmar Nova Senha</label>
                <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Confirme a nova senha" required minlength="6">
            </div>

            <button type="submit" class="btn-primary">Alterar Senha</button>
        </form>

        <div class="footer-links">
            <a th:href="@{/login}">Cancelar</a>
        </div>
    </div>
</div>
</body>
</html>
