<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Senha - SIGEC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/styles/style.css}">
</head>
<body id="auth-page">
<div class="container">
    <div class="logo">
        <img th:src="@{/img/logo-senac-colorida.png}" alt="Logo Senac">
    </div>
    <div class="card">
        <h1>Nova Senha</h1>
        <p>Crie uma nova senha para a sua conta</p>

        <!-- Mensagem de erro -->
        <div class="erro" th:if="${erro}" th:text="${erro}"></div>

        <form th:action="@{/esqueci-senha/salvar-senha}" method="post">
            <input type="hidden" name="email" th:value="${email}">

            <label for="novaSenha">Nova Senha</label>
            <div class="input-container">
                <input
                        type="password"
                        id="novaSenha"
                        name="novaSenha"
                        placeholder="Digite a nova senha"
                        required
                >
                <button type="button" class="toggle-password" aria-label="Mostrar senha" onclick="mostrarOcultarSenha(this)">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                        <path class="eye-slash" d="M3 3l18 18"></path>
                    </svg>
                </button>
            </div>

            <label for="confirmarSenha">Confirmar Nova Senha</label>
            <div class="input-container">
                <input
                        type="password"
                        id="confirmarSenha"
                        name="confirmarSenha"
                        placeholder="Confirme a nova senha"
                        required
                >
                <button type="button" class="toggle-password" aria-label="Mostrar senha" onclick="mostrarOcultarSenha(this)">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                        <path class="eye-slash" d="M3 3l18 18"></path>
                    </svg>
                </button>
            </div>

            <button type="submit">Alterar Senha</button>
        </form>

        <div class="links">
            <a th:href="@{/}">Cancelar</a>
        </div>
    </div>
</div>
<script th:src="@{/scripts/script.js}"></script>
</body>
</html>
