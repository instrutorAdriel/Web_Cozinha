<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGEC - Receitas</title>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/stylesReceitas.css}">
</head>
<body>
<div class="app-container">
    <div class="overlay" id="overlay"></div>

    <!-- Barra Lateral (Sidebar) conforme a imagem anexada -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <img th:src="@{/img/Logo branca Senac.png}" alt="SENAC — Fecomércio Sesc" class="brand-logo-img" />
            <div class="brand-text">
                <h1 class="brand-title">SIGEC</h1>
                <p class="brand-sub">PAINEL DO INSTRUTOR</p>
            </div>
        </div>

        <nav class="sidebar-nav">
            <p class="nav-group">MENU</p>
            <a th:href="@{/home}" class="nav-item">
                <span class="material-symbols-outlined">home</span>
                <span>Início</span>
            </a>
            <a th:href="@{/calendario}" class="nav-item">
                <span class="material-symbols-outlined">calendar_month</span>
                <span>Calendário</span>
            </a>
            <a href="#" class="nav-item active">
                <span class="material-symbols-outlined">menu_book</span>
                <span>Receitas</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <button class="btn-logout" type="button">
                <span class="material-symbols-outlined">logout</span>
                <span>Sair</span>
            </button>
        </div>
    </aside>

    <!-- Conteúdo Principal -->
    <div class="main-container">
        <!-- Topbar -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menu">
                    <span class="material-symbols-outlined">menu</span>
                </button>

                <div class="breadcrumb">
                    <span class="crumb-muted">SIGEC</span>
                    <span class="material-symbols-outlined crumb-sep">chevron_right</span>
                    <span class="crumb-current">Receitas</span>
                </div>
            </div>

            <!-- Ações: Seletor de Turma, Notificações e Perfil -->
            <div class="topbar-actions">
                <div class="turma-select-group">
                    <label class="field-label" for="turma-select">TURMA / LABORATÓRIO</label>
                    <div class="select-wrap">
                        <select id="turma-select"></select>
                        <span class="material-symbols-outlined select-arrow">expand_more</span>
                    </div>
                </div>

                <div class="notif-wrap">
                    <button class="icon-btn" id="notif-btn" aria-label="Notificações" aria-expanded="false">
                        <span class="material-symbols-outlined">notifications</span>
                        <span class="badge-dot" id="notif-badge" hidden></span>
                    </button>

                    <div class="notif-panel" id="notif-panel">
                        <div class="notif-head">
                            <h3>Notificações</h3>
                            <button class="notif-clear" id="notif-clear">Marcar todas como lidas</button>
                        </div>
                        <div class="notif-list" id="notif-list"></div>
                    </div>
                </div>

                <div class="user-box">
                    <div class="user-info">
                        <p class="user-name">Chef Ricardo Silva</p>
                        <p class="user-role">INSTRUTOR GASTRONOMIA</p>
                    </div>
                    <div class="user-avatar" title="Chef Ricardo Silva">RS</div>
                </div>
            </div>
        </header>

        <!-- Workspace de Receitas -->
        <div class="workspace-area">

            <!-- Coluna de Filtros e Lista de Receitas -->
            <aside class="recipes-list-pane">
                <div class="status-tabs">
                    <button class="status-tab-btn" data-status="todas">Todas</button>
                    <button class="status-tab-btn" data-status="disponivel">Disponíveis</button>
                    <button class="status-tab-btn active" data-status="datadas">Datadas</button>
                </div>


                <div class="category-filter-section">
                    <div class="category-header">
                        <span class="category-title">CATEGORIA PEDAGÓGICA</span>
                        <span class="category-count" id="recipeCountLabel">0 receitas</span>
                    </div>
                    <div class="category-tags" id="categoryTabs">
                        <button class="cat-pill active" data-cat="todas">Todas</button>
                        <button class="cat-pill" data-cat="Panificação">Panificação</button>
                        <button class="cat-pill" data-cat="Confeitaria">Confeitaria</button>
                        <button class="cat-pill" data-cat="Cozinha Quente">Cozinha Quente</button>
                        <button class="cat-pill" data-cat="Cozinha Fria">Cozinha Fria</button>
                    </div>
                </div>

                <div class="search-input-wrap">
                    <span class="material-symbols-outlined search-icon">search</span>
                    <input type="text" id="recipe-search" placeholder="Buscar receita ou ingrediente..." autocomplete="off">
                </div>

                <div id="listCol" class="scrollable-list"></div>
            </aside>

            <!-- Painel de Detalhes -->
            <main id="detailCol" class="recipe-detail-pane"></main>
        </div>
    </div>
</div>

<script th:src="@{/scripts/scriptReceitas.js}"></script>
</body>
</html>
