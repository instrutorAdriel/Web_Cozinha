<!DOCTYPE html>
<html class="light" lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENAC SIGEC — Receitas</title>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/stylesReceitas.css}">
</head>
<body>

<div class="app-container">
    <div class="overlay" id="overlay"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <img th:src="@{/img/logo-branca-senac-fecomercio.png}" alt="SENAC – Fecomércio Sesc" class="brand-logo-img">
            <div class="brand-text">
                <h1 class="brand-title">SIGEC</h1>
                <p class="brand-sub">Painel do Instrutor</p>
            </div>
        </div>

        <nav class="sidebar-nav">
            <p class="nav-group">Menu</p>
            <a th:href="@{/home}" class="nav-item">
                <span class="material-symbols-outlined">home</span>
                <span>Início</span>
            </a>
            <a th:href="@{/calendario}" class="nav-item">
                <span class="material-symbols-outlined">calendar_month</span>
                <span>Calendário</span>
            </a>
            <a href="#" class="nav-item active">
                <span class="material-symbols-outlined">menu_book</span>
                <span>Receitas</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <form th:action="@{/logout}" method="get">
                <button type="submit" class="btn-logout">
                    <span class="material-symbols-outlined">logout</span>
                    Sair
                </button>
            </form>
        </div>
    </aside>

    <!-- TOPBAR -->
    <header class="topbar">
        <div class="topbar-left">
            <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menu">
                <span class="material-symbols-outlined">menu</span>
            </button>

            <div class="breadcrumb">
                <span class="crumb-muted">SIGEC</span>
                <span class="material-symbols-outlined crumb-sep">chevron_right</span>
                <span class="crumb-current">Receitas</span>
            </div>
        </div>

        <div class="topbar-actions" style="display: flex; align-items: center; gap: 16px; margin: 0; padding: 0;">
            <div class="turma-select-group" style="display: flex; align-items: center; gap: 12px; margin: 0; padding: 0;">
                <label class="field-label" for="turma-select" style="display: inline-block; margin: 0; padding: 0; white-space: nowrap; font-size: 11px; font-weight: 700; color: #002747; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1;">TURMA / LABORATÓRIO</label>
                <div class="select-wrap" style="position: relative; display: inline-flex; align-items: center; margin: 0; padding: 0;">
                    <select id="turma-select" style="appearance: none; -webkit-appearance: none; background: #fff; color: #002747; border: 1px solid #c2c7d0; border-radius: 4px; padding: 8px 36px 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer; outline: none; margin: 0; line-height: normal;">
                        <option value="2024.1.A">Turma 2024.1.A — Padaria Lab 01</option>
                        <option value="2024.1.C">Turma 2024.1.C — Cozinha Pedagógica 02</option>
                        <option value="2024.2.N">Turma 2024.2.N — Cozinha Pedagógica 04</option>
                    </select>
                    <span class="material-symbols-outlined select-arrow" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: #002747; pointer-events: none; font-size: 20px;">expand_more</span>
                </div>
            </div>
            <div class="notif-wrap">
                <button class="icon-btn" id="notif-btn" aria-label="Notificações" aria-expanded="false">
                    <span class="material-symbols-outlined">notifications</span>
                    <span class="badge-dot" id="notif-badge" hidden></span>
                </button>

                <div class="notif-panel" id="notif-panel">
                    <div class="notif-head">
                        <h3>Notificações</h3>
                        <button class="notif-clear" id="notif-clear">Marcar todas como lidas</button>
                    </div>
                    <div class="notif-list" id="notif-list"></div>
                </div>
            </div>
        </div>
    </header>

    <!-- CORPO PRINCIPAL -->
    <main class="main">
        <div class="content-receitas">
            <div class="workspace-area">

                <!-- Coluna de Filtros e Listagem -->
                <aside class="recipes-list-pane">
                    <div class="status-tabs">
                        <button class="status-tab-btn active" data-status="todas">Todas</button>
                        <button class="status-tab-btn" data-status="disponivel">Disponíveis</button>
                        <button class="status-tab-btn" data-status="datadas">Datadas</button>
                    </div>

                    <div class="category-filter-section">
                        <div class="category-header">
                            <span class="category-title">CATEGORIA DA RECEITA</span>
                            <span class="category-count" id="recipeCountLabel">0 receitas</span>
                        </div>
                        <div class="category-tags" id="categoryTabs">
                            <button class="cat-pill active" data-cat="todas">Todas</button>
                            <button class="cat-pill" data-cat="BRASILEIRA">Brasileira</button>
                            <button class="cat-pill" data-cat="FRANCESA">Francesa</button>
                            <button class="cat-pill" data-cat="ITALIANA">Italiana</button>
                            <button class="cat-pill" data-cat="VEGANA">Vegana</button>
                            <button class="cat-pill" data-cat="PORTUGUESA">Portuguesa</button>
                            <button class="cat-pill" data-cat="ESPANHOLA">Espanhola</button>
                        </div>
                    </div>

                    <div class="search-input-wrap">
                        <span class="material-symbols-outlined search-icon">search</span>
                        <input type="text" id="recipe-search" placeholder="Buscar receita ou ingrediente..." autocomplete="off">
                    </div>

                    <div id="listCol" class="scrollable-list"></div>
                </aside>

                <!-- Detalhe da Receita Selecionada -->
                <section id="detailCol" class="recipe-detail-pane"></section>

            </div>
        </div>
    </main>
</div>

<script th:src="@{/scripts/scriptReceitas.js}"></script>
</body>
</html>
